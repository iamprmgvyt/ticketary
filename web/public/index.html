<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticketary Transcript Viewer</title>
    <link rel="stylesheet" href="/style.css">
    <script>
        // IMPORTANT: Replace this with the public URL of your Render bot service.
        // Vercel needs to talk back to your Render instance to get the JSON file.
        // Example: https://ticketary-bot-service.onrender.com
        const BOT_BASE_URL = "YOUR_RENDER_BOT_PUBLIC_URL"; 
        
        async function fetchTranscript(transcriptId) {
            const endpoint = `${BOT_BASE_URL}/data/transcripts/${transcriptId}.json`;
            console.log(`Fetching transcript from: ${endpoint}`);

            try {
                const response = await fetch(endpoint);
                
                if (!response.ok) {
                    throw new Error(`Failed to fetch transcript data. Status: ${response.status}`);
                }
                
                return await response.json();
            } catch (error) {
                console.error("Fetch error:", error);
                document.getElementById('transcript-container').innerHTML = 
                    `<div style="color: red; text-align: center;">
                        <h2>❌ Error Loading Transcript</h2>
                        <p>Could not retrieve transcript data for ID: ${transcriptId}.</p>
                        <p>Details: ${error.message}</p>
                        <p>Ensure the bot is running and the "BOT_BASE_URL" in this script is correct.</p>
                    </div>`;
                return null;
            }
        }

        function renderTranscript(data) {
            const container = document.getElementById('transcript-container');
            const meta = data.meta;
            let html = '';

            // --- 1. Header and Metadata ---
            html += `
                <div id="transcript-header">
                    <h1>${meta.guildName} - Ticket Transcript</h1>
                    <div>
                        ${meta.isPremium ? '<span class="premium-badge">⭐ Premium Transcript</span>' : '<span>Free Transcript</span>'}
                    </div>
                </div>
                <div id="metadata">
                    <p><strong>Channel:</strong> ${meta.channelName} (${meta.channelId})</p>
                    <p><strong>Opened By:</strong> ${meta.ticketCreator} | <strong>Closed By:</strong> ${meta.ticketCloser}</p>
                    <p><strong>Dates:</strong> Opened ${new Date(meta.createdAt).toLocaleString()} | Closed ${new Date(meta.closedAt).toLocaleString()}</p>
                    <p><strong>Messages:</strong> ${meta.messageCount}</p>
                    <p>Generated by ${meta.botName} Bot</p>
                </div>
                <hr>`;

            // --- 2. Messages ---
            data.messages.forEach(msg => {
                const timestamp = new Date(msg.timestamp).toLocaleTimeString();
                
                let content = msg.content.replace(/\n/g, '<br>');
                
                // Add attachments
                if (msg.attachments && msg.attachments.length > 0) {
                    msg.attachments.forEach(att => {
                        content += `<a href="${att.url}" target="_blank" class="attachment-link">Attachment: ${att.name}</a>`;
                    });
                }
                
                html += `
                    <div class="message">
                        <img src="${msg.author.avatar}" alt="${msg.author.tag}'s avatar" class="avatar">
                        <div class="message-content">
                            <div>
                                <span class="author-name">${msg.author.tag}</span>
                                ${msg.author.bot ? '<span class="bot-tag">BOT</span>' : ''}
                                <span class="timestamp">${timestamp}</span>
                            </div>
                            <div class="message-text">${content}</div>
                        </div>
                    </div>`;
            });

            container.innerHTML = html;
            document.title = `Transcript: ${meta.channelName}`;
        }


        document.addEventListener('DOMContentLoaded', () => {
            // Get the transcript ID from the URL path (e.g., /transcript/12345)
            const pathParts = window.location.pathname.split('/');
            const transcriptId = pathParts[pathParts.length - 1];

            if (transcriptId && transcriptId.length > 5) {
                fetchTranscript(transcriptId).then(data => {
                    if (data) {
                        renderTranscript(data);
                    }
                });
            } else {
                 document.getElementById('transcript-container').innerHTML = 
                    `<div style="text-align: center; padding-top: 50px;">
                        <h2>Ticketary Transcript Viewer</h2>
                        <p>Welcome! This page is used to display ticket transcripts.</p>
                        <p>Please use a valid transcript link provided by the bot.</p>
                    </div>`;
            }
        });
    </script>
</head>
<body>
    <div id="transcript-container">
        <h2 style="text-align: center;">Loading Transcript...</h2>
    </div>
</body>
</html>
